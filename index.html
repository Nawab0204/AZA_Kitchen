                            <p>There are generally three ways to achieve a handleless look:</p>

                        {activePage === 'gallery' && <Gallery />}
                        {activePage === 'blog' && <Blog />}
                        {activePage === 'contact' && <Contact />}
                    </main>

                    <Footer />
                    <FloatingWhatsApp />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
